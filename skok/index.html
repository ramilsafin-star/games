<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd8c0" />
    <title>Заводной Скок</title>
    <meta name="description" content="Заводной зайчик Скок едет по верстаку мастерской игрушек: нажми вовремя — и он перепрыгнет гайки, винтики и кнопки и соберёт шестерёнки." />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="stylesheet" href="./style.css?v=53f36b6b" />
  </head>
  <body>
    <canvas id="stage" aria-label="Мастерская: нажми, чтобы зайчик подпрыгнул"></canvas>
    <header class="top">
      <!-- Сюда портал вставляет кнопку «Все игры» (games-portal/build.mjs) -->
      <nav class="home-slot"><a href="../" aria-label="Все игры">🎮</a></nav>
      <button id="map-open" class="round" aria-label="Полка игрушек и трассы"></button>
      <div class="hud">
        <div class="track-name" id="track-name"></div>
        <div class="progress" id="progress"></div>
      </div>
      <div class="pill gears" id="gears-pill"><i></i><b id="gears">0</b><small id="gears-all"></small></div>
      <div class="tools">
        <button id="pause" class="round" aria-label="Пауза"></button>
        <button id="music" class="round"></button>
        <button id="sound" class="round"></button>
      </div>
    </header>
    <div id="tap" class="tap-hint" hidden><span class="finger">👆</span><b>Нажми — и поехали!</b></div>
    <div id="advice" class="advice" aria-live="assertive"></div>
    <div id="toast" class="toast" aria-live="polite"></div>

    <section id="title" class="screen title">
      <div class="logo">
        <h1><span>Заводной</span><span>Скок</span></h1>
        <p>Прыгай через гайки — собирай шестерёнки!</p>
      </div>
      <button id="play" class="big">▶ Заводи!</button>
    </section>

    <section id="paused" class="screen dim" hidden>
      <div class="card">
        <div class="result-icon">⏸️</div>
        <h2>Пауза</h2>
        <div class="row">
          <button id="pause-map" class="round wide" aria-label="Полка игрушек"></button>
          <button id="resume" class="big">▶ Дальше</button>
        </div>
      </div>
    </section>

    <section id="map" class="screen dim" hidden>
      <div class="sheet">
        <button id="map-close" class="round close" aria-label="Закрыть"></button>
        <h2>Полка игрушек</h2>
        <div id="shelf" class="shelf"></div>
        <div id="tracks" class="tracks"></div>
      </div>
    </section>

    <section id="result" class="screen dim" hidden>
      <div class="card">
        <div id="prize" class="prize"></div>
        <h2 id="result-title"></h2>
        <p id="result-text" class="result-text"></p>
        <div class="row">
          <button id="to-map" class="round wide" aria-label="Полка игрушек"></button>
          <button id="again" class="big alt">↻ Ещё раз</button>
          <button id="next" class="big">Дальше ▶</button>
        </div>
      </div>
    </section>

    <div id="nogl" class="screen nogl" hidden>
      <p>Тут нужна 3D-графика (WebGL), а браузер её не включил. Попробуйте другой браузер.</p>
    </div>
    <script src="./js/audio.js?v=53f36b6b"></script>
    <script type="module" src="./js/game.js?v=53f36b6b"></script>
  </body>
</html>
