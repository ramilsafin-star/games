<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1140">
  <title>Лунный оракул</title>
  <meta name="description" content="Карта дня, расклады таро, руны, нумерология, сюцай и подбор профессии по дате рождения. Предсказания носят развлекательный характер.">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="preload" href="./fonts/cormorant-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <script src="./vendor/vk/vk-bridge.min.js?v=3f732425"></script>
    <script src="./js/vk-host.js?v=3f732425" data-keys="oracle-v1" data-ad-gap="120"></script>
    <link rel="stylesheet" href="./style.css?v=3f732425">
</head>
<body data-screen="load">
  <div class="sky" aria-hidden="true"></div>
  <header id="bar" class="bar" hidden>
    <button class="icon-btn" id="back" aria-label="Назад"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="brand" id="brand"><img src="./assets/emblem.jpg" alt="" width="32" height="32"><span>Лунный оракул</span></div>
    <h1 class="bar-title" id="bar-title"></h1>
    <div class="bar-r">
      <button class="icon-btn" id="sound" aria-label="Звук" aria-pressed="true">
        <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9.5l4 5M21 9.5l-4 5"/></svg>
      </button>
      <button class="icon-btn" id="profile" aria-label="Профиль"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c1.2-4 4-5.5 7.5-5.5s6.3 1.5 7.5 5.5"/></svg></button>
    </div>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
  <section id="sheet" class="veil" hidden><div class="sheet" id="sheet-body" role="dialog" aria-modal="true"></div></section>
  <div id="toast" class="toast" role="status"></div>

  <div id="loading" class="loading" role="status">
    <img src="./assets/emblem.jpg" alt="" width="132" height="132">
    <i class="spin"></i>
    <span id="load-text">Раскладываем звёзды…</span>
  </div>
  <script type="module" src="./js/boot.js?v=3f732425"></script>
</body>
</html>
