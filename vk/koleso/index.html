<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2a6b" />
    <title>Колесо огоньков</title>
    <meta name="description" content="Ночной парк: енотик Фоня бросает огоньки на колесо обозрения. Бросай, когда внизу свободное место, — и колесо засияет." />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <script src="./vendor/vk/vk-bridge.min.js?v=c0baf5a6"></script>
    <script src="./js/vk-host.js?v=c0baf5a6" data-keys="koleso-v1" data-ad-gap="120"></script>
    <link rel="stylesheet" href="./style.css?v=c0baf5a6" />
  </head>
  <body>
    <canvas id="stage" aria-label="Колесо обозрения: нажми, чтобы бросить огонёк"></canvas>
    <header class="top">
      
      <button id="map-open" class="round" aria-label="Ночной парк и колёса"></button>
      <div class="hud">
        <div class="track-name" id="level-name"></div>
        <div class="lamps" id="lamps"></div>
      </div>
      <div class="pill balloons"><span>🎈</span><b id="balloons">0</b></div>
      <div class="tools">
        <button id="pause" class="round" aria-label="Пауза"></button>
        <button id="music" class="round"></button>
        <button id="sound" class="round"></button>
      </div>
    </header>
    <div id="tap" class="tap-hint" hidden><span class="finger">👆</span><b>Нажми — огонёк полетит!</b></div>
    <div id="toast" class="toast" aria-live="polite"></div>

    <section id="title" class="screen title">
      <div class="logo">
        <h1><span>Колесо</span><span>огоньков</span></h1>
        <p>Бросай огоньки на свободные места — и колесо засияет!</p>
      </div>
      <button id="play" class="big">▶ Зажигаем!</button>
    </section>

    <section id="paused" class="screen dim" hidden>
      <div class="card">
        <div class="result-icon">⏸️</div>
        <h2>Пауза</h2>
        <div class="row">
          <button id="pause-map" class="round wide" aria-label="Ночной парк"></button>
          <button id="resume" class="big">▶ Дальше</button>
        </div>
      </div>
    </section>

    <section id="map" class="screen dim" hidden>
      <div class="sheet">
        <button id="map-close" class="round close" aria-label="Закрыть"></button>
        <h2>Ночной парк</h2>
        <div id="levels" class="tracks levels"></div>
      </div>
    </section>

    <section id="result" class="screen dim" hidden>
      <div class="card">
        <div id="ride" class="ride"></div>
        <div id="stars" class="stars"><i></i><i></i><i></i></div>
        <h2 id="result-title"></h2>
        <p id="result-text" class="result-text"></p>
        <div class="row">
          <button id="to-map" class="round wide" aria-label="Ночной парк"></button>
          <button id="again" class="big alt">↻ Ещё раз</button>
          <button id="next" class="big">Дальше ▶</button>
        </div>
      </div>
    </section>

    <div id="nogl" class="screen nogl" hidden>
      <p>Тут нужна 3D-графика (WebGL), а браузер её не включил. Попробуйте другой браузер.</p>
    </div>
    <script src="./js/audio.js?v=c0baf5a6"></script>
    <script type="module" src="./js/game.js?v=c0baf5a6"></script>
    <script src="./js/juice.js?v=c0baf5a6"></script>
  </body>
</html>
