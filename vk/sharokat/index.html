<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7cc8ff" />
    <title>Шарокат</title>
    <meta name="description" content="Шар катится по радужным горкам в небе: петли, прыжки, трубы и препятствия." />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <script src="./vendor/vk/vk-bridge.min.js?v=58bcaabc"></script>
    <script src="./js/vk-host.js?v=58bcaabc" data-keys="sharokat-v1" data-ad-gap="120"></script>
    <link rel="stylesheet" href="./style.css?v=f444f678" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="speed" class="speed" aria-hidden="true"></div>
    <div id="flash" class="flash" aria-live="polite"></div>
    <!-- Верхняя панель: дом, прогресс, кристаллы, звук -->
    <header class="top">
      <div class="tools">
        <button id="music" class="round" aria-pressed="true">♪</button>
        <button id="sound" class="round" aria-pressed="true">🔊</button>
      </div>
    </header>
    <div id="hud" class="hud" hidden>
      <button id="home" class="round" aria-label="Пауза">Ⅱ</button>
      <div class="bar">
        <small id="level-name"></small>
        <div class="progress"><i id="progress-fill"></i><b id="progress-ball"></b><span class="flag">🏁</span></div>
      </div>
      <div class="gem-count"><span>💎</span><b id="gems">0</b></div>
    </div>
    <div id="ready" class="ready" hidden>
      <div class="swipe"><span>👆</span></div>
      <b>Коснись и веди пальцем</b>
    </div>
    <!-- Меню: большая кнопка, уровни, шары -->
    <section id="menu" class="menu" hidden>
      <h1>Шаро<em>кат</em></h1>
      <button id="play" class="play" aria-label="Играть">▶</button>
      <div class="row">
        <div class="total">💎 <b id="total">0</b></div>
        <button id="shop-open" class="shop-open" aria-label="Магазин шаров"><i id="shop-ball"></i><span>Шары</span></button>
      </div>
      <div id="levels" class="levels"></div>
    </section>
    <!-- Магазин шаров: покупка за кристаллы -->
    <section id="shop" class="shop" hidden>
      <div class="shop-card">
        <button id="shop-close" class="round close" aria-label="Закрыть">✕</button>
        <h3>Шары</h3>
        <div class="total">💎 <b id="wallet-shop">0</b></div>
        <div class="skin-preview">
          <canvas id="skin-preview" aria-label="Предпросмотр шара"></canvas>
          <div><strong id="preview-name"></strong><button id="buy-skin" hidden></button></div>
        </div>
        <div id="skins" class="skins"></div>
        <p id="shop-note" class="shop-note"></p>
      </div>
    </section>
    <section id="pause" class="shop" role="dialog" aria-modal="true" aria-label="Пауза" hidden>
      <div class="shop-card">
        <h3>Пауза</h3>
        <div class="actions">
          <button id="resume" class="play small" aria-label="Продолжить">▶</button>
          <button id="pause-again" class="round big" aria-label="Начать заново">↻</button>
          <button id="pause-menu" class="round big" aria-label="В меню">⌂</button>
        </div>
      </div>
    </section>
    <section id="finish" class="finish" hidden>
      <h2>Финиш!</h2>
      <div id="result-stars" class="stars"></div>
      <div class="result-gems">💎 <b id="result-gems"></b> <small>всего <b id="wallet-finish"></b></small></div>
      <p id="unlocked" class="unlocked" hidden></p>
      <div class="actions">
        <button id="to-menu" class="round big" aria-label="В меню">⌂</button>
        <button id="again" class="round big" aria-label="Ещё раз">↻</button>
        <button id="next" class="play small" aria-label="Следующий уровень">▶</button>
      </div>
    </section>
    <div id="nogl" class="nogl" hidden>Для этой игры нужен браузер с 3D-графикой</div>
    <script src="./js/audio.js?v=f444f678"></script>
    <script type="module" src="./js/game.js?v=f444f678"></script>
    <script src="./js/juice.js?v=f444f678"></script>
  </body>
</html>
