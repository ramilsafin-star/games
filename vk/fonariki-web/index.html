<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1028">
  <title>Фонарики до рассвета</title>
  <meta name="description" content="Уютная ночная 3D-игра: лови светлячков, корми костёр, спасай друзей от теней и продержись пять ночей до рассвета.">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <script src="./vendor/vk/vk-bridge.min.js?v=6e619b94"></script>
    <script src="./js/vk-host.js?v=6e619b94" data-keys="fonariki-v1" data-ad-gap="120"></script>
    <link rel="stylesheet" href="./style.css?v=6e619b94">
</head>
<body data-screen="load">
  <canvas id="stage" aria-label="Ночной лес"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="marks" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <header class="top">
    
    <div id="phase" class="pill play-only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><b id="phase-text">СУМЕРКИ</b><i class="clock"><i id="phase-bar"></i></i></div>
    <div id="fire" class="play-only" aria-label="Свет костра">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4 0 7-2.8 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2.5-4C7 9 5 11.5 5 15c0 4.2 3 7 7 7z"/></svg>
      <div class="bar"><i id="fire-fill"></i></div><b id="fire-text">СВЕТ 60%</b>
    </div>
    <div class="right">
      <div id="wallet" class="pill wallet" aria-label="Сияние"><span class="spark"></span><b id="coins">0</b><small id="rate"></small></div>
      <button class="round" id="sound" aria-label="Звук" aria-pressed="true"><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg><svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
      <button class="round play-only" id="pause" aria-label="Пауза"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
      <button class="round menu-only" id="settings" aria-label="Настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
    </div>
  </header>

  <div id="boss" class="play-only" hidden><span id="boss-text">БОЛЬШАЯ ТЕНЬ</span><div class="bar"><i id="boss-fill"></i></div></div>
  <aside id="side" class="play-only">
    <div id="quest" hidden><small id="quest-title">ПЕРВЫЕ ШАГИ</small><b id="quest-text"></b></div>
    <div id="event" hidden></div>
    <div id="buffs"></div>
    <div id="crew"></div>
  </aside>
  <div id="toasts" aria-live="polite"></div>
  <div id="frozen" hidden><b id="frozen-title">ЗАСТЫЛ!</b><span id="frozen-text"></span><button id="thaw-ad" class="ad" hidden></button></div>

  <div id="stick" hidden><i id="knob"></i></div>
  <div id="stick-hint" class="play-only" aria-hidden="true"><i></i></div>
  <div id="actbox" class="play-only">
    <div id="carry"><div id="jar"></div><div id="snacks"></div></div>
    <button id="act" aria-label="Действие"><svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45"/><circle id="act-ring" cx="50" cy="50" r="45"/></svg><span id="act-icon"></span></button>
    <small id="act-label"></small>
  </div>
  <small id="keys-hint" class="play-only"></small>

  <main id="menu" class="menu-only">
    <div class="card">
      <div class="eyebrow"><i></i><span id="eyebrow">5 НОЧЕЙ В ЛЕСУ</span></div>
      <h1 id="title">Фонарики <span>до рассвета</span></h1>
      <p class="lead" id="tagline"></p>
      <div id="menu-quest" hidden></div>
      <button id="play" class="primary big"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg><span id="play-text">Играть</span></button>
      <div class="row3">
        <button id="open-garden" class="ghost"><span class="ico house"></span><span id="garden-text">Сад</span></button>
        <button id="open-book" class="ghost"><span class="ico book"></span><span id="book-text">Коллекция</span></button>
        <button id="open-up" class="ghost"><span class="ico up"></span><span id="up-text">Улучшения</span></button>
      </div>
      <div id="crew-pick"><small id="crew-label">Помощники</small><div id="crew-btns"></div></div>
      <button id="snack-ad" class="ad" hidden></button>
      <div class="foot"><small id="record"></small><button id="help" class="link"></button></div>
    </div>
  </main>

  <section id="result" class="result-only" aria-live="polite"></section>
  <section id="sheet" class="veil" hidden>
    <div class="panel" role="dialog" aria-modal="true">
      <header><h2 id="sheet-title"></h2><button class="round small" id="sheet-close" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="body" id="sheet-body"></div>
    </div>
  </section>

  <div id="load" role="status"><div class="glowlogo"><i></i><i></i><i></i></div><b>Фонарики до рассвета</b><span id="load-text">Зажигаем костёр…</span><div class="loadbar"><i id="load-fill"></i></div></div>
  <div id="rotate"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M3 9a9 9 0 0 1 4-4M21 15a9 9 0 0 1-4 4"/></svg><b id="rotate-text">Поверни телефон боком</b></div>

  <script type="module" src="./js/boot.js?v=6e619b94"></script>
</body>
</html>
