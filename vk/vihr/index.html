<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5fb4f0">
  <title>Вихрь</title>
  <meta name="description" content="3D-аркада: управляй мультяшным вихрем, втягивай куриц, машины и дома и стань самым большим вихрем раунда.">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <script src="./vendor/vk/vk-bridge.min.js?v=7cc311db"></script>
    <script src="./js/vk-host.js?v=7cc311db" data-keys="vihr-v1" data-ad-gap="120"></script>
    <link rel="stylesheet" href="./style.css?v=7cc311db">
</head>
<body data-mode="load">
  <canvas id="stage" aria-label="Карта"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="top">
    
    <div class="wallet menu-only" aria-label="Монеты"><span class="coin"></span><b data-coins>0</b></div>
    <div id="timer" class="pill play-only"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><b id="time">2:00</b></div>
    <div id="me" class="pill me play-only">1 место</div>
    <div class="tools">
      <button class="round" id="sound" aria-label="Звук" aria-pressed="true"><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg><svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
      <button class="round play-only" id="pause" aria-label="Пауза"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
    </div>
  </header>

  <!-- Загрузка -->
  <div id="load" role="status"><span class="spin" aria-hidden="true"></span><span id="load-text">Закручиваем ветер…</span></div>

  <!-- Главное меню -->
  <main id="menu" class="menu-only">
    <div class="card">
      <div class="eyebrow"><i></i> АРКАДА ПРО ТОРНАДО</div>
      <h1>Вихрь</h1>
      <p class="lead">Втягивай всё, что меньше тебя, расти и стань самым большим вихрем раунда!</p>
      <div id="map-card" class="map">
        <button id="prev-map" class="arrow" aria-label="Предыдущая карта">‹</button>
        <div class="map-info"><b id="map-name">Ферма</b><small id="map-note"></small><div id="map-num" class="dots" aria-hidden="true"></div></div>
        <button id="next-map" class="arrow" aria-label="Следующая карта">›</button>
      </div>
      <button id="play" class="primary big">Играть</button>
      <div class="pair">
        <button id="open-upgrades" class="ghost">Улучшения</button>
        <button id="open-skins" class="ghost">Облики</button>
      </div>
      <small id="record"></small>
      <small class="keys">Веди пальцем или мышью · WASD и стрелки · Esc — пауза</small>
    </div>
  </main>

  <!-- Раунд -->
  <section id="hud" class="play-only" aria-hidden="true">
    <ol id="board"></ol>
    <div id="next"></div>
    <div id="arrows"></div>
    <div id="stick" hidden><i id="knob"></i></div>
  </section>
  <div id="say" aria-live="polite"></div>
  <div id="toast" aria-live="polite"></div>
  <div id="hint" hidden></div>

  <!-- Итоги -->
  <section id="result" class="result-only" aria-live="polite"></section>

  <!-- Панели: пауза, улучшения, облики -->
  <section id="panel" class="veil" hidden>
    <div class="sheet" id="panel-body"></div>
  </section>

  <script type="module" src="./js/boot.js?v=7cc311db"></script>
</body>
</html>
