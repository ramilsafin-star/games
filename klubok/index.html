<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3fa24e" />
    <title>Волшебный клубочек</title>
    <meta name="description" content="Котёнок Пуговка и волшебный клубочек проходят сказочные лабиринты: сад, замок, ледяная пещера, ночной лес и облачный город." />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="stylesheet" href="./style.css?v=bad15ac6" />
  </head>
  <body>
    <canvas id="stage" aria-label="Лабиринт: проведи пальцем, куда бежать котёнку"></canvas>
    <header class="top">
      <!-- Сюда портал вставляет кнопку «Все игры» (games-portal/build.mjs) -->
      <nav class="home-slot"><a href="../" aria-label="Все игры">🎮</a></nav>
      <button id="map-open" class="round" aria-label="Карта лабиринтов"></button>
      <div class="hud">
        <div class="track-name" id="level-name"></div>
        <div class="loot"><span id="items"></span><span id="keys" class="keys"></span></div>
      </div>
      <div class="tools">
        <button id="pause" class="round" aria-label="Пауза"></button>
        <button id="music" class="round"></button>
        <button id="sound" class="round"></button>
      </div>
    </header>
    <button id="look" class="round look" aria-label="Посмотреть сверху"></button>
    <button id="hint" class="hint-btn" aria-label="Клубочек, покажи дорожку"></button>
    <div id="swipe" class="swipe-hint" hidden><span class="finger">👆</span><b>Проведи пальцем!</b></div>
    <div id="toast" class="toast" aria-live="polite"></div>

    <section id="title" class="screen title">
      <div class="logo">
        <h1><span>Волшебный</span><span>клубочек</span></h1>
        <p>Котёнок Пуговка ищет дорогу к друзьям</p>
      </div>
      <button id="play" class="big">▶ В путь!</button>
    </section>

    <section id="paused" class="screen dim" hidden>
      <div class="card">
        <div class="result-icon">⏸️</div>
        <h2>Пауза</h2>
        <div class="row">
          <button id="pause-map" class="round wide" aria-label="Карта"></button>
          <button id="restart" class="big alt">↻ Сначала</button>
          <button id="resume" class="big">▶ Дальше</button>
        </div>
      </div>
    </section>

    <section id="map" class="screen dim" hidden>
      <div class="sheet">
        <button id="map-close" class="round close" aria-label="Закрыть"></button>
        <h2>Куда пойдём?</h2>
        <div id="worlds" class="worlds"></div>
        <button id="surprise" class="big surprise" hidden>🎁 Сюрприз-лабиринт</button>
      </div>
    </section>

    <section id="result" class="screen dim" hidden>
      <div class="card">
        <div id="friend" class="friend"></div>
        <div id="stars" class="stars"><i></i><i></i><i></i></div>
        <h2 id="result-title"></h2>
        <p id="result-text" class="result-text"></p>
        <div class="row">
          <button id="to-map" class="round wide" aria-label="Карта"></button>
          <button id="again" class="big alt">↻ Ещё раз</button>
          <button id="next" class="big">Дальше ▶</button>
        </div>
      </div>
    </section>

    <div id="nogl" class="screen nogl" hidden>
      <p>Тут нужна 3D-графика (WebGL), а браузер её не включил. Попробуйте другой браузер.</p>
    </div>
    <script src="./js/audio.js?v=bad15ac6"></script>
    <script type="module" src="./js/game.js?v=bad15ac6"></script>
    <script src="./js/juice.js?v=bad15ac6"></script>
  </body>
</html>
