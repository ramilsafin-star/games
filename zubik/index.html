<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#bfefff" />
    <title>Зубик</title>
    <meta name="description" content="Зубной доктор для зверят: почисти, полечи и укрась улыбку." />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="stylesheet" href="./style.css?v=9a893b63" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <!-- Сюда портал вставляет кнопку «Все игры» (games-portal/build.mjs) -->
        <nav class="home-slot"><a href="../" aria-label="Все игры">🎮</a></nav>
        <div class="who"><b id="who"></b><small>🦷 <span id="count">0</span></small></div>
        <div class="tools">
          <button id="gallery-open" class="round" aria-label="Галерея улыбок"></button>
          <button id="music" class="round"></button>
          <button id="sound" class="round"></button>
        </div>
      </header>
      <div id="steps" class="steps" aria-hidden="true"></div>
      <canvas id="stage" aria-label="Ротик пациента"></canvas>
      <nav id="tray" class="tray" aria-label="Инструменты"></nav>
    </main>
    <div id="cursor" class="cursor" hidden aria-hidden="true"></div>
    <div id="hand" class="hand" hidden aria-hidden="true">👆</div>
    <div id="flash" class="flash" aria-hidden="true"></div>
    <div id="flashwhite" class="flashwhite" aria-hidden="true"></div>
    <!-- Фото улыбки после приёма -->
    <section id="photo" class="photo" hidden>
      <div class="card">
        <img id="photo-img" alt="Улыбка пациента" />
        <b id="photo-who"></b>
        <div id="photo-new" class="new" hidden></div>
        <button id="next" class="next" aria-label="Следующий пациент">▶</button>
      </div>
    </section>
    <dialog id="gallery" aria-labelledby="gallery-title">
      <button id="gallery-close" class="round close" aria-label="Закрыть"></button>
      <h2 id="gallery-title">Галерея улыбок</h2>
      <div id="gallery-grid" class="grid"></div>
    </dialog>
    <div id="nogl" class="nogl" hidden>Для этой игры нужен браузер с 3D-графикой</div>
    <script src="./js/audio.js?v=9a893b63"></script>
    <script type="module" src="./js/game.js?v=9a893b63"></script>
  </body>
</html>
