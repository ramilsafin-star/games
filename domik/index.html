<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Домик на дереве</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Домик" />
    <meta name="theme-color" content="#8fdcff" />
    <link rel="stylesheet" href="./style.css?v=cbdaeeb3" />
  </head>
  <body>
    <canvas id="game" aria-label="Большое дерево на поляне"></canvas>
    <div id="steps" aria-hidden="true"></div>
    <button id="btn-sound" class="round" type="button" aria-label="Выключить звук">🔊</button>
    <div id="tray"></div>
    <button id="btn-ok" type="button" aria-label="Готово" hidden>✓</button>
    <div id="bin" aria-hidden="true">🗑️</div>
    <div id="hand" aria-hidden="true">👆</div>
    <p id="load" role="status">🌳</p>
    <script>
      // Простой синтаксис намеренно: сообщение покажется и там, где браузер не прочитает игру
      window.domikFail = function () {
        var box = document.getElementById("load");
        box.hidden = false;
        box.className = "fail";
        box.textContent =
          "Этот браузер не тянет 3D-графику игры. Обновите систему устройства или откройте игру в свежем Safari или Chrome.";
      };
      window.addEventListener("error", function (e) {
        if (!window.Domik || !window.Domik.ready) window.domikFail();
      });
      setTimeout(function () {
        if (!window.Domik || !window.Domik.ready) window.domikFail();
      }, 30000);
    </script>
    <script src="./js/audio.js?v=cbdaeeb3"></script>
    <script type="module" src="./js/game.js?v=cbdaeeb3" onerror="window.domikFail()"></script>
  <a href="../" aria-label="Все игры" style="position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:50;width:52px;height:52px;border-radius:50%;background:#fffffff0;box-shadow:0 4px 0 #0003;display:grid;place-items:center;font-size:27px;text-decoration:none">🎮</a></body>
</html>
