<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Наши игры</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Наши игры" />
    <meta name="theme-color" content="#8fdcff" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" href="./icon-192.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: linear-gradient(170deg, #8fdcff 0%, #c6f2a4 62%, #fff0b3 100%) fixed;
        color: #233e35;
        font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, -apple-system, sans-serif;
        padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(24px + env(safe-area-inset-bottom, 0px));
        -webkit-tap-highlight-color: transparent;
      }
      h1 {
        margin: 4px 0 18px;
        text-align: center;
        font-size: clamp(30px, 6vw, 46px);
        font-weight: 900;
        letter-spacing: -1px;
      }
      #games {
        display: grid;
        gap: 18px;
        max-width: 1180px;
        margin: auto;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      }
      .game {
        position: relative;
        display: block;
        border-radius: 32px;
        overflow: hidden;
        background: #fff;
        color: inherit;
        text-decoration: none;
        box-shadow: 0 8px 0 var(--color);
        touch-action: manipulation;
      }
      .game:active {
        transform: translateY(4px);
        box-shadow: 0 4px 0 var(--color);
      }
      .game:focus-visible {
        outline: 5px solid #127bd1;
        outline-offset: 4px;
      }
      .game img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        background: var(--color);
      }
      .game b {
        display: block;
        padding: 14px 92px 16px 20px;
        font-size: clamp(22px, 3.6vw, 30px);
        font-weight: 850;
        line-height: 1.1;
      }
      .game i {
        position: absolute;
        right: 14px;
        bottom: 12px;
        width: 66px;
        height: 66px;
        border-radius: 50%;
        background: var(--color);
        color: #fff;
        font-style: normal;
        font-size: 30px;
        line-height: 66px;
        text-align: center;
        padding-left: 4px;
        box-shadow: 0 4px 0 #0000002e;
      }
    </style>
  </head>
  <body>
    <h1>Наши игры</h1>
    <main id="games"></main>
    <script src="./games.js?v=a5369205"></script>
    <script>
      var list = document.getElementById("games");
      GAMES.forEach(function (game) {
        var link = document.createElement("a");
        link.className = "game";
        link.href = game.url;
        link.style.setProperty("--color", game.color);
        link.innerHTML = '<img alt="" /><b></b><i aria-hidden="true">▶</i>';
        link.querySelector("img").src = game.cover;
        link.querySelector("b").textContent = game.title;
        list.appendChild(link);
      });
    </script>
  </body>
</html>
