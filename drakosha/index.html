<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd8c2" />
    <title>Почта Дракоши</title>
    <meta name="description" content="Помоги дракончику Дракоше угадать слово на письме: буква за буквой, пока не улетели марки." />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="stylesheet" href="./style.css?v=ea8eb052" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <!-- Сюда портал вставляет кнопку «Все игры» (games-portal/build.mjs) -->
        <nav class="home-slot"><a href="../" aria-label="Все игры">🎮</a></nav>
        <button id="themes-open" class="round" aria-label="Конверты"></button>
        <button id="album-open" class="round" aria-label="Альбом открыток"></button>
        <div id="pack" class="pack" aria-label="Письма в конверте"></div>
        <div class="tools">
          <button id="riddle" class="round hintbtn" aria-label="Послушать загадку"></button>
          <button id="bulb" class="round hintbtn" aria-label="Открыть букву"></button>
          <button id="music" class="round"></button>
          <button id="sound" class="round"></button>
        </div>
      </header>
      <div class="stage-wrap">
        <canvas id="stage" aria-label="Почта: плитки со словом, картинка-подсказка, марки и Дракоша"></canvas>
        <p id="riddle-text" class="riddle" hidden></p>
      </div>
      <div class="foot">
        <nav id="keys" class="keys" aria-label="Буквы"></nav>
        <div id="after" class="after" hidden>
          <b id="after-word"></b>
          <div class="row">
            <button id="retry" class="round wide" aria-label="Ещё раз"></button>
            <button id="next" class="big" aria-label="Следующее письмо">Дальше ▶</button>
          </div>
        </div>
      </div>
    </main>

    <section id="title" class="screen title">
      <div class="logo">
        <h1><span>Почта</span><span>Дракоши</span></h1>
        <p>Угадай слово на письме — буква за буквой!</p>
      </div>
      <button id="play" class="big">▶ Играть</button>
    </section>

    <section id="themes" class="screen dim" hidden>
      <div class="sheet">
        <button id="themes-close" class="round close" aria-label="Закрыть"></button>
        <h2>Выбери конверт</h2>
        <label class="difficulty">
          Сложность
          <select id="difficulty">
            <option value="standard">Обычная · 4 марки</option>
            <option value="easy">Малыш · 6 марок</option>
          </select>
        </label>
        <div id="theme-list" class="envelopes"></div>
      </div>
    </section>

    <section id="album" class="screen dim" hidden>
      <div class="sheet wide">
        <button id="album-close" class="round close" aria-label="Закрыть"></button>
        <h2>Альбом открыток <small id="album-count"></small></h2>
        <div id="album-list"></div>
      </div>
    </section>

    <section id="done" class="screen dim" hidden>
      <div class="card">
        <h2>Конверт доставлен!</h2>
        <div id="stars" class="stars"><i></i><i></i><i></i></div>
        <p id="done-text" class="done-text"></p>
        <div id="done-cards" class="mini"></div>
        <div class="row">
          <button id="to-themes" class="round wide" aria-label="Выбрать конверт"></button>
          <button id="more" class="big">Ещё конверт ▶</button>
        </div>
      </div>
    </section>
    <div id="nogl" class="screen nogl" hidden>
      <p>Тут нужна 3D-графика (WebGL), а браузер её не включил. Попробуйте другой браузер.</p>
    </div>
    <script src="./js/audio.js?v=ea8eb052"></script>
    <script type="module" src="./js/game.js?v=ea8eb052"></script>
    <script src="./js/juice.js?v=ea8eb052"></script>
  </body>
</html>
